aid: bivacor
name: BiVACOR
description: 'BiVACOR, Inc. is a privately held, clinical-stage medical device company
  with corporate operations in Huntington Beach, California, clinical operations in
  Houston, Texas, and engineering operations on the Gold Coast, Queensland, Australia.
  It develops the BiVACOR Total Artificial Heart (TAH), a titanium biventricular rotary
  blood pump built around a single magnetically levitated rotor with a dual-sided impeller
  that replaces both ventricles of a failing heart, with no valves, flexing diaphragms
  or mechanical bearings, and flows above 12 L/min. Founded by Chief Technical Officer
  Daniel Timms, PhD, and led by CEO Jim Dillon with Chief Medical Officer William E.
  Cohn, MD, the company completed the first-in-human implantation at The Texas Heart
  Institute in July 2024 under an FDA Early Feasibility Study, received FDA Breakthrough
  Device Designation in May 2025, and was accepted into the FDA Total Product Life Cycle
  Advisory Program in August 2025. The TAH is an investigational device, limited by
  federal law to investigational use, and is not approved for commercial sale. BiVACOR
  is a medical hardware and clinical-research business - it publishes no developer
  program, public API, SDK, or machine-readable API contract.'
