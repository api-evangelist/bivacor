    wp-mail-smtp/v1, awb/instagram, awb, wp/v2, wp-site-health/v1, wp-block-editor/v1
    and wp-abilities/v1.
  counted_as_api: false
  reason: >-
    This is incidental CMS infrastructure that ships enabled by default with WordPress
    and its plugins, not a product API BiVACOR designed, documented, versioned or
    offers to integrators. It is recorded here because it was really observed, and
    deliberately NOT registered as an API in apis.yml or scored - doing so would credit
    the company with a developer surface it never published.
